[project]
name = "lanctools"
version = "1.0.3"
license = { text = "MIT" }
description = "Tools for working with phased local ancestry data stored in the `.lanc` file format"
readme = "README.md"
authors = [{ name = "Franklin Ockerman", email = "frank.ockerman@gmail.com" }]
requires-python = ">=3.10"

dependencies = [
  "numba>=0.63.1",
  "numpy>=2.2.6",
  "pandas>=2.3.3",
  "pgenlib>=0.93.0",
  "typer>=0.20.1",
]

[project.urls]
Homepage = "https://github.com/frankp-0/lanctools"
Documentation = "https://frankp-0.github.io/lanctools/"
Repository = "https://github.com/frankp-0/lanctools"
Issues = "https://github.com/frankp-0/lanctools/issues"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"

wheel.exclude = ["data", "result"]
sdist.exclude = ["data", "result"]

[tool.uv]
cache-keys = [
  { file = "pyproject.toml" },
  { file = "src/**/*.{h,c,hpp,cpp}" },
  { file = "CMakeLists.txt" },
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes (unused imports/variables, etc.)
  "I",   # isort (import sorting)
  "B",   # flake8-bugbear (common design bugs)
  "UP",  # pyupgrade (upgrades syntax to modern Python)
  "RUF", # Ruff-specific rules
]

ignore = []

[tool.ruff.lint.per-file-ignores]
"src/lanctools/cli.py" = ["B008"]


[tool.ruff.format]
quote-style = "double"
indent-style = "space"


[build-system]
requires = ["scikit-build-core>=0.10", "pybind11"]
build-backend = "scikit_build_core.build"

[dependency-groups]
dev = [
  "ipython>=8.37.0",
  "pytest>=9.0.2",
  "pytest-cov>=7.0.0",
  "ruff>=0.16.3",
  "mkdocstrings-python>=2.0.1",
  "zensical>=0.0.17",
]


[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
lanctools = "lanctools.cli:main_entry"


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
  "--strict-markers",
  "--strict-config",
  "--cov=src",
  "--cov-report=term-missing",
]
